<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>科學實驗室六關</title>
<style>
:root{
  --navy:#17243f; --navy2:#223256; --gold:#d9a441; --ink:#1b2437; --soft:#6b7891;
  --bg:#f4f6fb; --card:#ffffff; --ok:#1f8a53; --okbg:#e7f6ed; --no:#b23b3b; --nobg:#fdeceb;
  --line:#dfe4ee; --shadow:0 2px 10px rgba(23,36,63,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Microsoft JhengHei","PingFang HK","Noto Sans HK",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 40px}
header{background:var(--navy);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:20;
  box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hrow{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.htitle{font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;background:#44557c}
.dot.on{background:var(--gold)}
.dot.now{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.lang{background:#2f4572;border:0;color:#fff;font:inherit;font-size:13px;font-weight:700;
  padding:5px 11px;border-radius:999px;cursor:pointer}
.lang:active{background:#3d5a94}
h2{font-size:21px;margin:18px 0 4px}
.en{font-size:13px;color:var(--soft);font-weight:400;display:block;margin-top:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
  margin:12px 0;box-shadow:var(--shadow)}
.big{font-size:19px;font-weight:700;margin:0 0 10px}
.q{font-size:18px;font-weight:700;margin:0 0 12px}
.photo{width:100%;max-width:330px;display:block;margin:0 auto 14px;border-radius:12px;
  border:1px solid var(--line)}
.opts{display:grid;gap:9px}
@media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);
  border-radius:11px;padding:12px 14px;font:inherit;font-size:17px;text-align:left;cursor:pointer;width:100%}
.opt:active{transform:scale(.99)}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;
  font-size:14px;font-weight:700;display:grid;place-items:center}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.opt.no .k{background:var(--no)}
.en2{display:block;font-size:13px;color:var(--soft);font-weight:400;margin-top:1px;line-height:1.25}
.opt .en2{font-size:12.5px}
.lrow.bad{border-color:var(--no);background:var(--nobg)}
.lrow.bad .lin{border-color:var(--no);color:var(--no)}
.chip.bad{background:var(--nobg);border-color:#f0cdc9;color:#8d2d2d;cursor:pointer}
.chip.bad::after{content:" ✕";font-weight:700}
.hz.bad{border-color:var(--no);box-shadow:0 0 0 3px rgba(178,59,59,.2)}
.mbox .tapme{font-size:13px;color:var(--gold);font-weight:700}
.wronglist{background:var(--nobg);border:1px solid #f0cdc9;border-radius:11px;padding:12px;margin-top:10px}
.wronglist h4{margin:0 0 7px;font-size:15px;color:#8d2d2d}
.wronglist div{font-size:15px;padding:5px 0;border-top:1px solid #f3d7d4}
.wronglist div:first-of-type{border-top:0}
.ord{display:grid;gap:8px}
.ordslot{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);
  border-radius:11px;padding:11px 13px;font-size:16px;cursor:pointer}
.ordslot .num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-size:14px;font-weight:700}
.ordslot.ok{border-color:var(--ok);background:var(--okbg)}
.ordslot.bad{border-color:var(--no);background:var(--nobg)}
.ordslot.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,164,65,.25)}
.opt[disabled]{cursor:default;opacity:.95}
.btn{background:var(--navy);color:#fff;border:0;border-radius:11px;padding:13px 22px;
  font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.btn:active{background:var(--navy2)}
.btn.gold{background:var(--gold);color:#3a2a06}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line)}
.btn.ghost.gold,.btn.gold{background:var(--gold);color:#3a2a06;border:2px solid var(--gold)}
.btn.ghost.gold{box-shadow:0 0 0 3px rgba(217,164,65,.3)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.fb{margin-top:12px;padding:12px 14px;border-radius:11px;font-size:16px}
.fb.ok{background:var(--okbg);color:#14603a;border:1px solid #bfe3ce}
.fb.no{background:var(--nobg);color:#8d2d2d;border:1px solid #f0cdc9}
.src{font-size:13px;color:var(--soft);margin-top:6px}
.bar{height:7px;background:#e4e8f1;border-radius:99px;overflow:hidden;margin:10px 0 2px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.meta{font-size:13px;color:var(--soft)}
/* 配對 */
.hzgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.hz{background:#fff;border:2px solid var(--line);border-radius:11px;padding:7px;cursor:pointer}
.hz img{width:100%;display:block;border-radius:6px}
.hz.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,164,65,.25)}
.hz.done{opacity:.35;cursor:default}
.mboxes{display:grid;gap:9px;margin-top:12px}
.mbox{background:#fff;border:2px dashed var(--line);border-radius:11px;padding:12px;cursor:pointer}
.mbox.hot{border-color:var(--gold);border-style:solid}
.mbox h4{margin:0 0 5px;font-size:16px}
.mbox ul{margin:0;padding-left:19px;font-size:14px;color:#44506b}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:4px}
.chip{background:var(--okbg);border:1px solid #bfe3ce;color:#14603a;border-radius:999px;
  padding:3px 10px;font-size:13px;font-weight:700}
/* 數字鎖 */
.lock{display:grid;gap:10px}
.lrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;
  border:2px solid var(--line);border-radius:11px;padding:12px 14px}
.lrow.ok{border-color:var(--ok);background:var(--okbg)}
.lq{font-size:18px;font-weight:700;flex:1;min-width:150px}
.lin{width:108px;font:inherit;font-size:19px;font-weight:700;text-align:center;padding:9px;
  border:2px solid var(--line);border-radius:9px;background:#fff}
.lin:focus{outline:0;border-color:var(--gold)}
.ladder{background:#fff8ea;border:1px solid #f0dcb4;border-radius:11px;padding:12px;margin-top:10px}
.ladder .lad{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
  font-size:15px;font-weight:700;margin-top:6px}
.ladder .u{background:var(--navy);color:#fff;border-radius:999px;padding:3px 13px}
.ladder .ar{color:var(--soft);font-size:13px}
/* 本生燈 */
.sim{display:grid;gap:12px}
@media(min-width:620px){.sim{grid-template-columns:300px 1fr}}
.stage{background:#101827;border-radius:14px;padding:8px;display:grid;place-items:center}
.ctl{display:grid;gap:9px;align-content:start}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:#fff;border:2px solid var(--line);border-radius:9px;padding:10px 6px;
  font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.seg button.on{border-color:var(--gold);background:#fff6e6}
.lab{font-size:14px;font-weight:700;color:var(--soft)}
.tasks{display:grid;gap:7px;margin-top:4px}
.task{display:flex;gap:9px;align-items:flex-start;font-size:15px;background:#fff;
  border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.task .tick{flex:0 0 22px;height:22px;border-radius:50%;background:#e4e8f1;color:#8794ad;
  display:grid;place-items:center;font-size:13px;font-weight:700}
.task.done .tick{background:var(--ok);color:#fff}
.task.done{background:var(--okbg);border-color:#bfe3ce}
/* report */
.rep{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.rep div{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center}
.rep b{display:block;font-size:27px;color:var(--navy)}
.rep span{font-size:13px;color:var(--soft)}
.key{background:#fff8ea;border:1px solid #f0dcb4;border-radius:11px;padding:13px;font-size:16px}
.key b{color:#8a6412}
/* 學號選單 */
.pw{font:inherit;font-weight:700;text-align:center;padding:10px 12px;
  border:2px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
.pw:focus{outline:0;border-color:var(--gold)}
.hidden{display:none !important}
.center{text-align:center}
.muted{color:var(--soft);font-size:14px}
ol.steps{padding-left:22px;margin:8px 0}
ol.steps li{margin:4px 0;font-size:16px}
</style>
</head>
<body>
<header><div class="hrow">
  <div class="htitle" id="htitle">科學實驗室六關</div>
  <div class="dots" id="dots"></div>
</div></header>
<div class="wrap" id="app"></div>

  try{
    const v = JSON.parse(localStorage.getItem("lab4")||"null");
    // 舊版本（四關）或壞掉的存檔會令後面當機，形狀唔啱就當冇玩過
    if(!v || !Array.isArray(v.rep) || v.rep.length!==6) return null;
    return v;
  }catch(e){ return null; }
}

/* ───────── 排行榜連線 ─────────
   放上 Vercel 之後，/api/scores 會把成績寫入 Google Sheet，全班共用。
   直接用瀏覽器開這個檔案（file://）時沒有伺服器，改用這部機的 localStorage，
   方便老師自己試玩、試排行榜；但那些成績只留在這部機，不會跨裝置。 */
const API = "/api/scores";
const OFFLINE = location.protocol === "file:";

function localRuns(){ try{ return JSON.parse(localStorage.getItem("lab4:runs")||"[]"); }catch(e){ return []; } }
function localPush(run){
  const a = localRuns();
  run.attempt = a.filter(r=>r.cls===run.cls && +r.no===+run.no).length + 1;
  a.unshift(run);
  try{ localStorage.setItem("lab4:runs", JSON.stringify(a.slice(0,2000))); }catch(e){}
  return run.attempt;
}

async function submit(run){
  if(OFFLINE) return {ok:true, attempt:localPush(run), local:true};
  try{
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"},
                                body:JSON.stringify(run)});
    const j = await r.json();
    return (j && j.ok) ? j : {ok:false};
  }catch(e){ return {ok:false}; }
}

async function fetchBoard(){
  if(OFFLINE) return {ok:true, runs:localRuns()};
  try{
    const r = await fetch(API, {cache:"no-store"});
    const j = await r.json();
    return (j && j.ok) ? j : null;
  }catch(e){ return null; }
}

function buildS1(){
  const qs=[];
  APP.forEach(a=>{ qs.push({a, kind:"name"}); if(a.u) qs.push({a, kind:"use"}); });
  return pick(qs, Math.min(S1_N, qs.length));
}
function stage1(){
  clear(); head();
  const QS=buildS1();
  let i=0, miss=0, t0=Date.now();
  const wrongs=[];                       // 報告用：答錯過的題目
  const wrap=el(`<div><h2>${t("s1")}<span class="en">${T.s1[1]}</span></h2>
    <div class="bar"><i id="pb" style="width:0%"></i></div>
    <div class="meta" id="pm"></div><div id="qa"></div></div>`);
  app.appendChild(wrap);
  const qa=wrap.querySelector("#qa");
  function draw(){
    const q=QS[i], it=q.a, isName=q.kind==="name";
    const lz=o=>isName?o.zh:o.uz, le=o=>isName?o.en:o.ue;
    const pool=APP.filter(o=>o!==it && (isName||o.u)).filter(o=>lz(o)!==lz(it));
    const seen=new Set([lz(it)]); const wr=[];
    for(const o of shuffle(pool)){ if(!seen.has(lz(o))){ seen.add(lz(o)); wr.push(o); } if(wr.length===3) break; }
    const opts=shuffle([{o:it,right:true},...wr.map(o=>({o,right:false}))]);
    wrap.querySelector("#pb").style.width=(i/QS.length*100)+"%";
    wrap.querySelector("#pm").textContent=`${i+1} / ${QS.length}`;
    qa.innerHTML="";
    const c=el(`<div class="card">
      <p class="q">${bi(isName?T.q1[0]:T.q1b[0], isName?T.q1[1]:T.q1b[1])}</p>
      <img class="photo" src="${IMG[it.img]}" alt="">
      <div class="opts"></div><div id="fb"></div></div>`);
    const box=c.querySelector(".opts");
    let missed=false;
    opts.forEach((op,n)=>{
      const b=el(`<button class="opt"><span class="k">${"ABCD"[n]}</span><span>${bi(lz(op.o),le(op.o))}</span></button>`);
      b.onclick=()=>{
        if(b.disabled) return;
        if(op.right){
          [...box.children].forEach(x=>x.disabled=true);
          b.classList.add("ok");
          c.querySelector("#fb").innerHTML=
            `<div class="fb ok"><b>${ui("right")}</b>　${bi(it.zh+"　"+it.uz, it.en+" — "+it.ue)}
             <div class="src">${t("book")} ${it.p}</div></div>`;
          const nb=el(`<div class="row"><button class="btn">${i<QS.length-1?t("next"):t("go")}</button></div>`);
          nb.querySelector("button").onclick=()=>{ i++; i<QS.length?draw():fin(); };
          c.querySelector("#fb").appendChild(nb);
        } else {
          // 答錯：變紅、停用該選項，給提示，可以再揀，直到揀中為止
          b.classList.add("no"); b.disabled=true;
          if(!missed){ missed=true; miss++;
            wrongs.push({q: isName?T.q1[L]:T.q1b[L], img:it.img,
                         a: L?le(it):`${lz(it)}（${le(it)}）`, p:it.p}); }
          c.querySelector("#fb").innerHTML=
            `<div class="fb no"><b>${ui("wrong")}</b>　${bi(it.hz,it.he)}</div>`;
        }
      };
      box.appendChild(b);
    });
    qa.appendChild(c);
  }
  function fin(){
    S.rep[0]={ok:QS.length-miss, n:QS.length, hint:miss,
              sec:Math.round((Date.now()-t0)/1000), wrongs};
    save(); report(0);
  }
  draw();
}

// 提示直接給出換算規則，例如 1 km = 1000 m
const RULES = {km:"1 km ＝ 1000 m", m:"1 m ＝ 100 cm", cm:"1 cm ＝ 10 mm"};
function ruleFor(q){                       // 回傳該題需要的換算規則（陣列）
  const set=new Set(q.match(/\b(km|mm|cm|m)\b/g)||[]);
  const out=[];
  if(set.has("km")) out.push(RULES.km);
  if(set.has("cm")&&set.has("m")) out.push(RULES.m);
  if(set.has("m")&&!set.has("cm")&&!set.has("km")) out.push(RULES.m);
  if(set.has("mm")) out.push(RULES.cm);
  return out;
}

  }));

      <div class="lad" style="margin-top:4px"><span class="ar">km ×1000→ m ×100→ cm ×10→ mm　　（反方向用除）</span></div>
    </div>`;
  };
  wrap.querySelector("#ck").onclick=()=>{
    tries++;
    let good=0; const wrongs=[];
    LOCK.forEach((q,n)=>{
      const row=lk.querySelector(`.lrow[data-n="${n}"]`);
      const v=parseFloat(lk.querySelector(`input[data-n="${n}"]`).value);
      if(v===q.a){ row.classList.add("ok"); row.classList.remove("bad"); good++; }
      else { row.classList.add("bad"); row.classList.remove("ok");
             wrongs.push({q:q.q.replace("___","＿＿"), a:String(q.a), p:"p.43"}); }
    });
    const f=wrap.querySelector("#fb");
    if(good===LOCK.length){
      f.innerHTML=`<div class="fb ok"><b>🔓 ${t("unlocked")}</b><div class="src">${t("book")} p.43</div></div>`;
      const nb=el(`<div class="row"><button class="btn">${ui("go")}</button></div>`);

                  sec:Math.round((Date.now()-t0)/1000), tries, wrongs:[]};
        save(); report(2);
      };
      f.appendChild(nb); wrap.querySelector("#ck").disabled=true;
    } else {
      f.innerHTML=`<div class="fb no">${good} / ${LOCK.length}　${bi("紅色那幾題再試一次。按「提示」會給你換算的方法。",
        "Try the red ones again. Tap Hint for the conversion rule.")}</div>`;
    }
  };
}

function burnerSVG(st){
  const fl = st.flame;                          // none | lum | non | strike
  let top="";                                   // 燈管口以上的火焰（畫在燈管之前）
  if(fl==="lum") top=`<path d="M100 150 Q86 108 100 64 Q114 108 100 150Z" fill="#f5c542" opacity=".95">
      <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
       values="M100 150 Q86 108 100 64 Q114 108 100 150Z;M100 150 Q90 104 100 58 Q110 106 100 150Z;M100 150 Q86 108 100 64 Q114 108 100 150Z"/></path>`;
  if(fl==="non") top=`<path d="M100 150 Q90 118 100 86 Q110 118 100 150Z" fill="#4da3ff" opacity=".92">
      <animate attributeName="d" dur=".6s" repeatCount="indefinite"
       values="M100 150 Q90 118 100 86 Q110 118 100 150Z;M100 150 Q92 116 100 80 Q108 116 100 150Z;M100 150 Q90 118 100 86 Q110 118 100 150Z"/></path>
      <path d="M100 150 Q95 134 100 116 Q105 134 100 150Z" fill="#9ed0ff" opacity=".8"/>`;
  const holeOpen = st.collar==="half" ? 7 : st.collar==="open" ? 12 : 0;
  // 回擊：煤氣在燈管「裏面」燒，所以要畫在燈管之後，並在氣孔位置透出綠光
  const inside = fl==="strike" ? `
      <rect x="94" y="158" width="12" height="60" fill="#5fe08a" opacity=".9">
        <animate attributeName="opacity" dur=".25s" repeatCount="indefinite" values=".9;.45;.9"/></rect>
      <circle cx="100" cy="221" r="11" fill="#5fe08a" opacity=".75">
        <animate attributeName="r" dur=".3s" repeatCount="indefinite" values="11;14;11"/></circle>
      <text x="126" y="176" fill="#5fe08a" font-size="15" font-weight="700">嘶嘶</text>` : "";
  return `<svg viewBox="0 0 200 300" width="100%" style="max-width:270px">
    ${st.mat?`<rect x="26" y="252" width="148" height="13" rx="3" fill="#e9eef7"/>`:""}
    ${top}
    <rect x="92" y="150" width="16" height="92" fill="#9aa6bb"/>
    <rect x="92" y="150" width="16" height="92" fill="none" stroke="#6b7891"/>
    ${inside}
    ${holeOpen?`<rect x="${108-holeOpen}" y="214" width="${holeOpen}" height="13" fill="#101827"/>`:""}
    <rect x="86" y="206" width="28" height="15" rx="3" fill="#78859c"/>
    <ellipse cx="100" cy="248" rx="40" ry="10" fill="#2f6fd0"/>
    <path d="M60 248 Q100 228 140 248 L140 252 Q100 234 60 252Z" fill="#2558a8"/>
    <path d="M60 250 Q24 254 18 268" stroke="#2c3443" stroke-width="9" fill="none" stroke-linecap="round"/>
    ${st.lighter?`<g><rect x="126" y="120" width="9" height="34" rx="3" fill="#c0392b"/>
      <rect x="124" y="108" width="13" height="16" rx="3" fill="#7f8c8d"/></g>`:""}
  </svg>`;
}
function stage4(){
  clear(); head();
  let step=0, errs=0, t0=Date.now();
  const st={mat:false, collar:"half", lighter:false, gas:false, flame:"none", water:false, copper:false};
  const wrap=el(`<div><h2>${t("s4")}<span class="en">${T.s4[1]}</span></h2>
    <div class="card"><div class="sim">
      <div class="stage" id="stg"></div>
      <div class="ctl">
        <div><div class="lab">${L?"Heat-proof mat / lighter":"隔熱墊．點火器"}</div>
          <div class="seg"><button id="bmat">${L?"Put on mat":"放隔熱墊"}</button>
            <button id="blit">${L?"Lighter":"點火器"}</button></div></div>
        <div><div class="lab">${L?"Collar (air hole)":"調節環（氣孔）"}</div>
          <div class="seg">
            <button data-c="close">${L?"Closed":"關閉"}</button>
            <button data-c="half">${L?"Half open":"打開一半"}</button>
            <button data-c="open">${L?"Fully open":"完全打開"}</button></div></div>
        <div><div class="lab">${L?"Gas tap":"煤氣掣"}</div>
          <div class="seg"><button id="bgas">${L?"Turn on":"扭開"}</button>
            <button id="boff">${L?"Turn off":"關掉"}</button></div></div>
        <div><div class="lab">${L?"Heating":"加熱"}</div>
          <div class="seg"><button id="bw">${L?"Boiling tube of water":"大試管的水"}</button>
            <button id="bc">${L?"Copper":"銅片"}</button></div></div>
      </div></div>
      <div class="tasks" id="tk"></div><div id="fb"></div></div></div>`);
  app.appendChild(wrap);
  const stg=wrap.querySelector("#stg"), tk=wrap.querySelector("#tk"), fb=wrap.querySelector("#fb");
  function paint(){
    stg.innerHTML=burnerSVG(st);
    tk.innerHTML=SIM.map((s,n)=>`<div class="task ${n<step?"done":""}">
      <span class="tick">${n<step?"✓":n+1}</span><span>${L?s.en:s.zh}</span></div>`).join("");
    wrap.querySelectorAll("[data-c]").forEach(b=>b.classList.toggle("on",b.dataset.c===st.collar));
    wrap.querySelector("#bmat").classList.toggle("on",st.mat);
    wrap.querySelector("#blit").classList.toggle("on",st.lighter);
    wrap.querySelector("#bgas").classList.toggle("on",st.gas);
  }
  function say(okk,msg,src){ fb.innerHTML=`<div class="fb ${okk?"ok":"no"}">${msg}${src?`<div class="src">${t("book")} ${src}</div>`:""}</div>`; }
  function want(){ return SIM[step] ? SIM[step].act : null; }
  // 某一步的條件有冇達成（用現時狀態判斷，所以次序寬鬆，唔會卡住）
  function met(a){
    switch(a){
      case "mat":     return st.mat;
      case "close":   return st.collar==="close" && !st.gas;
      case "lighter": return st.lighter;
      case "gas":     return st.gas && st.flame!=="none";
      case "half":    return st.collar==="half" && st.flame==="non";
      case "water":   return st.water;
      case "copper":  return st.copper;
    }
    return false;
  }
  function advance(){
    while(step<SIM.length && met(SIM[step].act)) step++;
    paint();
    if(step===SIM.length) finish();
  }
  const wrongs=[];
  function bad(msg,src){ errs++; say(false,msg,src); paint();
    if(!wrongs.some(w=>w.a===msg)) wrongs.push({q:L?"Mistake":"做錯了", a:msg, p:src||"p.64–68"}); }

  wrap.querySelector("#bmat").onclick=()=>{ st.mat=true;
    if(want()==="mat"){ say(true,L?"Good. The burner always sits on a heat-proof mat.":"好。本生燈一定要放在隔熱墊上。","p.64"); advance(); }
    else advance(); };
  wrap.querySelector("#blit").onclick=()=>{ st.lighter=true;
    if(want()==="lighter"){ say(true,L?"Hold the lighter near the top of the barrel. Keep your hand below the barrel top.":"把點火器管口放近燈管口。手的位置要低於燈管口。","p.64"); advance(); }
    else advance(); };
  wrap.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
    st.collar=b.dataset.c;
    if(st.flame==="none"){
      if(want()==="close" && st.collar==="close"){ say(true,L?"Air hole closed. This must be done before lighting.":"氣孔已關閉。點火之前一定要做這一步。","p.66"); advance(); }
      else advance();
    } else {
      if(st.collar==="close"){ st.flame="lum"; say(true,L?"Luminous flame: yellow, irregular, quiet, lower temperature.":"發光焰：黃色、形狀不規則、寧靜、温度較低。","p.68"); advance(); }
      else if(st.collar==="half"){ st.flame="non";
        if(want()==="half"){ say(true,L?"Non-luminous flame: blue, regular, noisy, higher temperature. Use this one for heating.":"無光焰：藍色、形狀規則、嘈雜、温度較高。加熱就用這一種。","p.68"); advance(); }
        else { say(true,L?"Non-luminous flame — the one for heating.":"無光焰——加熱就用這一種。","p.68"); advance(); } }
      else { say(true,L?"Fully open. Remember: a fully open air hole at lighting causes strike back.":"完全打開。記住：點火時氣孔完全打開就會回擊。","p.66"); advance(); }
    }
  });
  wrap.querySelector("#bgas").onclick=()=>{
    if(!st.mat){ return bad(L?"Put the burner on the heat-proof mat first.":"要先把本生燈放在隔熱墊上。","p.64"); }
    if(!st.lighter){ return bad(L?"Hold the lighter near the barrel first.":"要先把點火器放近燈管口。","p.64"); }
    st.gas=true;
    if(st.collar==="open"){                       // 回擊
      st.flame="strike"; paint();
      fb.innerHTML=`<div class="fb no"><b>${L?"STRIKE BACK!":"回擊！"}</b><br>
        ${L?"The flame is green and hissing — the gas is burning inside the barrel."
           :"火焰呈綠色，有「嘶嘶」的聲音——煤氣在燈管裏面燃燒。"}
        <div class="src">${t("book")} p.66</div></div>`;
      const q=el(`<div class="card" style="margin-top:10px"><p class="q" style="font-size:17px">${L?"What must you do now?":"現在應該做甚麼？"}</p>
        <div class="opts"></div></div>`);
      const A=[[L?"Turn off the gas tap at once, then tell the teacher":"立即關掉煤氣掣，然後通知老師",1],
               [L?"Touch the collar to close the air hole":"用手摸調節環，把氣孔關小",0],
               [L?"Blow out the flame":"用口把火吹熄",0]];
      A.sort(()=>Math.random()-.5).forEach((a,n)=>{
        const b=el(`<button class="opt"><span class="k">${"ABC"[n]}</span><span>${a[0]}</span></button>`);
        b.onclick=()=>{
          q.querySelectorAll(".opt").forEach(x=>x.disabled=true);
          if(a[1]){ b.classList.add("ok");
            st.gas=false; st.flame="none"; st.collar="close"; st.lighter=false;
            say(true,L?"Correct. Turn off the gas tap, tell the teacher, and never touch the barrel or collar — they are very hot. Now start again with the air hole closed."
                      :"正確。立即關掉煤氣掣、通知老師，切勿觸摸燈管和調節環——它們很熱。現在把氣孔關閉，重新開始。","p.66");
            q.remove(); step=1; errs++; paint();
          } else { b.classList.add("no"); q.querySelectorAll(".opt").forEach(x=>{ if(x.textContent.includes(A.find(z=>z[1])[0])) x.classList.add("ok"); }); }
        };
        q.querySelector(".opts").appendChild(b);
      });
      fb.appendChild(q);
      return;
    }
    st.flame = st.collar==="close" ? "lum" : "non";
    say(true, st.collar==="close"
        ? (L?"Lit. With the air hole closed you get a luminous flame.":"點着了。氣孔關閉，所以是發光焰。")
        : (L?"Lit — non-luminous flame.":"點着了——無光焰。"), "p.65");
    advance();
  };
  wrap.querySelector("#boff").onclick=()=>{ st.gas=false; st.flame="none"; paint();
    say(true,L?"Gas tap off.":"煤氣掣已關掉。",""); };
  wrap.querySelector("#bw").onclick=()=>{
    if(st.flame!=="non") return bad(L?"Use the non-luminous flame (air hole half open) for heating.":"加熱要用無光焰（氣孔打開一半）。","p.68");
    if(want()!=="water") return bad(L?"Finish the lighting steps first.":"先完成點火的步驟。","p.66");
    st.water=true; say(true,L?"Water poured to one-third full, held with a test tube holder, rotated slowly until it boils. Never point the mouth at anyone."
      :"水注至三分一滿，用試管夾夾着，慢慢打轉直至沸騰。管口不可向着自己或其他人。","p.65"); advance(); };
  wrap.querySelector("#bc").onclick=()=>{
    if(st.flame!=="non") return bad(L?"Use the non-luminous flame for heating.":"加熱要用無光焰。","p.68");
    if(want()!=="copper") return bad(L?"Heat the boiling tube of water first.":"先完成加熱大試管的水。","p.65");
    st.copper=true; say(true,L?"Held with tongs and heated for about half a minute — the copper turns from brown-red to black."
      :"用鉗夾着，加熱約半分鐘——銅片由棕紅色變成黑色。","p.66"); advance(); };
  function finish(){
    S.rep[3]={ok:SIM.length, n:SIM.length, hint:errs,
              sec:Math.round((Date.now()-t0)/1000), wrongs};
    save();
    const nb=el(`<div class="row"><button class="btn">${ui("go")}</button></div>`);
    nb.querySelector("button").onclick=()=>report(3);
    fb.appendChild(nb);
  }
  paint();
}

/* ── 第五關　縱切面圖 ── */
function stage5(){
  clear(); head();
  const QS=pick(SECPAIR, Math.min(S5_N, SECPAIR.length));
  let i=0, miss=0, t0=Date.now(); const wrongs=[];
  const wrap=el(`<div><h2>${t("s5")}<span class="en">${T.s5[1]}</span></h2>
    <div class="bar"><i id="pb" style="width:0%"></i></div>
    <div class="meta" id="pm"></div><div id="qa"></div></div>`);
  app.appendChild(wrap);
  const qa=wrap.querySelector("#qa");
  function draw(){
    const it=QS[i];
    const wr=shuffle(SECPAIR.filter(o=>o!==it)).slice(0,3);
    const opts=shuffle([{o:it,right:true},...wr.map(o=>({o,right:false}))]);
    wrap.querySelector("#pb").style.width=(i/QS.length*100)+"%";
    wrap.querySelector("#pm").textContent=`${i+1} / ${QS.length}`;
    qa.innerHTML="";
    const c=el(`<div class="card">
      <p class="q">${bi(T.q5[0],T.q5[1])}</p>
      <img class="photo" style="max-width:230px" src="${IMG[it.photo]}" alt="">
      <div class="opts" style="grid-template-columns:1fr 1fr"></div><div id="fb"></div></div>`);
    const box=c.querySelector(".opts");
    let missed=false;
    opts.forEach((op,n)=>{
      const b=el(`<button class="opt" style="flex-direction:column;align-items:center;gap:4px;padding:10px">
        <span class="k">${"ABCD"[n]}</span>
        <img src="${IMG[op.o.sec]}" alt="" style="width:100%;max-width:120px;height:92px;object-fit:contain">
      </button>`);
      b.onclick=()=>{
        if(b.disabled) return;
        if(op.right){
          [...box.children].forEach(x=>x.disabled=true); b.classList.add("ok");
          c.querySelector("#fb").innerHTML=`<div class="fb ok"><b>${ui("right")}</b>　${bi(it.zh,it.en)}
            <div class="src">${t("book")} p.39</div></div>`;
          const nb=el(`<div class="row"><button class="btn">${i<QS.length-1?ui("next"):ui("go")}</button></div>`);
          nb.querySelector("button").onclick=()=>{ i++; i<QS.length?draw():fin(); };
          c.querySelector("#fb").appendChild(nb);
        } else {
          b.classList.add("no"); b.disabled=true;
          if(!missed){ missed=true; miss++;
            wrongs.push({q:`${it.zh}（${it.en}）`, a:L?"see p.39":"縱切面圖見課本 p.39", p:"p.39"}); }
          c.querySelector("#fb").innerHTML=`<div class="fb no"><b>${ui("wrong")}</b>　${bi(
            "想一想：縱切面圖是把儀器從中間切開，由側面看到的形狀。看看它是平底、圓底還是一條直線。",
            "Think: a section diagram shows the shape you see when the apparatus is cut down the middle. Is the bottom flat, round, or just a line?")}</div>`;
        }
      };
      box.appendChild(b);
    });
    qa.appendChild(c);
  }
  function fin(){
    S.rep[4]={ok:QS.length-miss, n:QS.length, hint:miss,
              sec:Math.round((Date.now()-t0)/1000), wrongs};
    save(); report(4);
  }
  draw();
}

/* ── 第六關　火三角 ── */
function triSVG(off){            // off = fuel | oxy | heat | null（被移走的一邊變暗）
  const c=k=>off===k?"#c8cdd8":({fuel:"#E2703A",oxy:"#2f8fd0",heat:"#d94f4f"})[k];
  return `<svg viewBox="0 0 220 190" style="width:100%;max-width:240px">
    <line x1="110" y1="22" x2="24" y2="168" stroke="${c('fuel')}" stroke-width="13" stroke-linecap="round"/>
    <line x1="110" y1="22" x2="196" y2="168" stroke="${c('oxy')}" stroke-width="13" stroke-linecap="round"/>
    <line x1="24" y1="168" x2="196" y2="168" stroke="${c('heat')}" stroke-width="13" stroke-linecap="round"/>
    <text x="48" y="96" font-size="17" font-weight="700" fill="${c('fuel')}" text-anchor="middle">燃料</text>
    <text x="174" y="96" font-size="17" font-weight="700" fill="${c('oxy')}" text-anchor="middle">氧</text>
    <text x="110" y="186" font-size="17" font-weight="700" fill="${c('heat')}" text-anchor="middle">高温</text>
    ${off?`<text x="110" y="118" font-size="30" text-anchor="middle">💨</text>`
         :`<text x="110" y="122" font-size="34" text-anchor="middle">🔥</text>`}
  </svg>`;
}
function stage6(){
  clear(); head();
  const QS=pick(FIRE, Math.min(S6_N, FIRE.length));
  let i=0, miss=0, t0=Date.now(); const wrongs=[];
  const wrap=el(`<div><h2>${t("s6")}<span class="en">${T.s6[1]}</span></h2>
    <div class="bar"><i id="pb" style="width:0%"></i></div>
    <div class="meta" id="pm"></div><div id="qa"></div></div>`);
  app.appendChild(wrap);
  const qa=wrap.querySelector("#qa");
  const KEYS=["fuel","oxy","heat","run"];
  function draw(){
    const it=QS[i];
    wrap.querySelector("#pb").style.width=(i/QS.length*100)+"%";
    wrap.querySelector("#pm").textContent=`${i+1} / ${QS.length}`;
    qa.innerHTML="";
    const c=el(`<div class="card">
      <p style="font-size:17px;margin:0 0 6px">${bi(it.scene[0],it.scene[1])}</p>
      <div class="key" style="margin-bottom:10px"><b>${ui("doing")}：</b>${bi(it.act[0],it.act[1])}</div>
      <div style="display:grid;place-items:center;margin-bottom:8px" id="tri">${triSVG(null)}</div>
      <p class="q">${bi(T.q6[0],T.q6[1])}</p>
      <div class="opts"></div><div id="fb"></div></div>`);
    const box=c.querySelector(".opts");
    let missed=false;
    shuffle(KEYS.slice()).forEach((k,n)=>{
      const b=el(`<button class="opt"><span class="k">${"ABCD"[n]}</span>
        <span>${bi(F_LABEL[k][0],F_LABEL[k][1])}</span></button>`);
      b.onclick=()=>{
        if(b.disabled) return;
        if(k===it.ans){
          [...box.children].forEach(x=>x.disabled=true); b.classList.add("ok");
          c.querySelector("#tri").innerHTML=triSVG(it.ans==="run"?null:it.ans);
          c.querySelector("#fb").innerHTML=`<div class="fb ok"><b>${ui("right")}</b>　${bi(it.why[0],it.why[1])}
            <div class="src">${t("book")} p.32–36</div></div>`;
          const nb=el(`<div class="row"><button class="btn">${i<QS.length-1?ui("next"):ui("go")}</button></div>`);
          nb.querySelector("button").onclick=()=>{ i++; i<QS.length?draw():fin(); };
          c.querySelector("#fb").appendChild(nb);
        } else {
          b.classList.add("no"); b.disabled=true;
          if(!missed){ missed=true; miss++;
            wrongs.push({q:L?it.act[1]:it.act[0],
                         a:L?F_LABEL[it.ans][1]:F_LABEL[it.ans][0], p:"p.32–36"}); }
          c.querySelector("#fb").innerHTML=`<div class="fb no"><b>${ui("wrong")}</b>　${bi(
            "想一想：這個做法令火少了甚麼？是沒有東西可燒、空氣進不去，還是温度下降了？",
            "Think: what does this action take away — something to burn, the air, or the heat?")}</div>`;
        }
      };
      box.appendChild(b);
    });
    qa.appendChild(c);
  }
  function fin(){
    S.rep[5]={ok:QS.length-miss, n:QS.length, hint:miss,
              sec:Math.round((Date.now()-t0)/1000), wrongs};
    save(); report(5);
  }
  draw();
}

/* ── 成績報告 ── */
const KEY=[
  ["每件儀器和安全設備都有自己的用途，入到實驗室要認得。",
   "Every piece of apparatus and safety equipment has its own use — know them in the lab.","p.25、p.37–38"],
  ["見到標籤就知道要做甚麼安全措施。","The symbol tells you which safety measures to take.","p.30 表1.2"],
  ["大單位變小單位用乘，小單位變大單位用除。","Big unit to small, multiply; small to big, divide.","p.43"],
  ["點火前一定要關氣孔；加熱要用無光焰（藍色火焰）。",
   "Always close the air hole before lighting; heat with the non-luminous flame.","p.66、p.68"],
  ["縱切面圖是把儀器從中間切開、由側面看到的形狀；畫的時候用鉛筆和尺，不要加陰影。",
   "A section diagram is the shape seen when the apparatus is cut down the middle. Use a pencil and ruler, and no shading.","p.39"],
  ["燃料 ＋ 氧 ＋ 高温 ＝ 火。移走其中一樣，火就會熄滅。",
   "Fuel + oxygen + heat = fire. Take away any one of them and the fire goes out.","p.32–36"],
];
function report(n){
  clear(); head();
  const r=S.rep[n];
  const ws=(r.wrongs||[]);
  const wrongHTML = ws.length
    ? `<div class="wronglist"><h4>${ui("wrongs")}（${ws.length}）</h4>
         ${ws.map(w=>`<div><b>${w.q}</b>　→　${w.a}
           <span class="meta">　${t("book")} ${w.p}</span></div>`).join("")}</div>`
    : `<div class="fb ok" style="margin-top:10px"><b>${ui("nowrong")}</b></div>`;
  app.appendChild(el(`<div>
    <h2>${t(["s1","s2","s3","s4","s5","s6"][n])}　${L?"Report":"成績報告"}</h2>
    <div class="card">
      <div class="rep">
        <div><b>${fmt(r.sec)}</b><span>${ui("time")}</span></div>
        <div><b>${r.ok}/${r.n}</b><span>${ui("score")}</span></div>
        <div><b>${r.hint}</b><span>${n===2?ui("hints"):ui("mistakes")}</span></div>
      </div>
      ${wrongHTML}
      <div class="key" style="margin-top:10px"><b>${L?"Remember":"記住"}：</b>${KEY[n][L]}
        <div class="src">${t("book")} ${KEY[n][2]}</div></div>
      <div class="row"><button class="btn gold" id="nx">${n<5?t("go"):t("done")}</button></div>
    </div></div>`));
  document.getElementById("nx").onclick=()=>{ S.stage=n+1; save(); router(); };
}

/* ── 總結 ── */
function finale(){
  clear(); head();
  const tot=S.rep.reduce((a,r)=>a+(r?r.ok:0),0);
  const max=S.rep.reduce((a,r)=>a+(r?r.n:0),0);
  const sec=S.rep.reduce((a,r)=>a+(r?r.sec:0),0);
  app.appendChild(el(`<div>
    <h2 class="center">🎉 ${t("done")}</h2>
    <div class="card center">
      <div class="rep">
        <div><b>${S.cls}</b><span>${L?"Class":"班別"}</span></div>
        <div><b>${tot}/${max}</b><span>${ui("total")}</span></div>
        <div><b>${fmt(sec)}</b><span>${ui("time")}</span></div>
      </div>
      <div class="meta">${t("no")} ${S.grp}</div>
      <div style="margin-top:14px">${["s1","s2","s3","s4","s5","s6"].map((k,i)=>{
        const r=S.rep[i]||{ok:0,n:0,sec:0}; return `<div class="task done"><span class="tick">✓</span>
        <span>${t(k)}　${r.ok}/${r.n}　${fmt(r.sec)}</span></div>`; }).join("")}</div>
      <div class="meta" id="up" style="margin-top:12px">${t("sending")}</div>
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn gold" id="bd">${ui("board")}</button>
        <button class="btn ghost" id="rs">${ui("again")}</button></div>
    </div></div>`));
  document.getElementById("rs").onclick=()=>{
    S={cls:S.cls, grp:S.grp, stage:0, rep:[null,null,null,null,null,null]}; save(); router();
  };
  document.getElementById("bd").onclick=()=>board();
  submit({cls:S.cls, no:+S.grp, total:tot, max, sec,
          stages:S.rep.map(r=>({ok:(r||0).ok|0,n:(r||0).n|0,hint:(r||0).hint|0,sec:(r||0).sec|0})),
          ts:Date.now()}).then(r=>{
    const u=document.getElementById("up");
    if(u) u.textContent = r && r.ok ? "✓ "+t("sent") : t("offline");
  });
}

/* ── 排行榜 ── */
let boardTab=0;                       // 0 總榜　1–6 各關　7 班際
let boardMode=0;                      // 0 第一次　1 重玩
async function board(){
  clear(); head();
  app.appendChild(el(`<div><h2>${ui("board")}</h2>
    <div class="card"><div class="meta">${t("sending")}</div></div></div>`));
  const data=await fetchBoard();
  drawBoard(data);
}
function drawBoard(data){
  clear(); head();
  const back=`<div class="row" style="justify-content:center;margin-top:4px">
      <button class="btn ghost" id="bk">${L?"Back":"返回"}</button></div>`;
  if(!data || !data.runs){
    app.appendChild(el(`<div><h2>${ui("board")}</h2>
      <div class="card center"><p>${t("offline")}</p>${back}</div></div>`));
    document.getElementById("bk").onclick=()=>finale(); return;
  }
  const all=data.runs.filter(r=>r&&r.cls);
  const runs=all.filter(r=> boardMode===0 ? (r.attempt||1)===1 : (r.attempt||1)>=2 );
  const tabs=[t("all"),t("s1"),t("s2"),t("s3"),t("s4"),t("s5"),t("s6"),t("inter")];
  const medal=i=>["🥇","🥈","🥉"][i]||(i+1);
  const byPlayer=(get,cmp)=>{                 // 每人取最佳一次，並記住那一次是第幾次玩
    const m={};
    runs.forEach(r=>{ const v=get(r); if(!v) return;
      const row={...v, no:r.no, cls:r.cls, attempt:r.attempt||1};
      const k=r.cls+"#"+r.no;
      m[k]=m[k] ? {...m[k], tries:m[k].tries+1, best:[m[k].best,row].sort(cmp)[0]}
                : {tries:1, best:row};
    });
    return Object.values(m).map(x=>({...x.best, tries:x.tries}));
  };
  const cmpAll=(a,b)=> b.total-a.total || a.sec-b.sec;
  const cmpStage=(a,b)=> b.ok-a.ok || a.sec-b.sec || a.hint-b.hint;

  const wrap=el(`<div><h2>${ui("board")}</h2>
    <div class="row" id="modes" style="gap:6px;margin:4px 0 0"></div>
    <p class="muted" style="margin:6px 0 0">${boardMode===0?t("firstnote"):t("replaynote")}</p>
    <div class="row" id="tabs" style="gap:6px;margin:6px 0 2px"></div>
    <div id="bc"></div>${back}</div>`);
  app.appendChild(wrap);
  const md=wrap.querySelector("#modes");
  [t("first"),t("replay")].forEach((label,i)=>{
    const b=el(`<button class="btn ${i===boardMode?"gold":"ghost"}"
      style="padding:9px 20px;font-size:16px">${label}</button>`);
    b.onclick=()=>{ boardMode=i; drawBoard(data); };
    md.appendChild(b);
  });
  const tb=wrap.querySelector("#tabs");
  tabs.forEach((label,i)=>{
    const b=el(`<button class="btn ${i===boardTab?"gold":"ghost"}"
      style="padding:8px 13px;font-size:15px">${label.replace(/^第.關　/,"").replace(/^Stage \d　/,"")}</button>`);
    b.onclick=()=>{ boardTab=i; drawBoard(data); };
    tb.appendChild(b);
  });
  const bc=wrap.querySelector("#bc");

  function table(rows, cols){
    const showTry = boardMode===1;            // 重玩榜才顯示「第幾次」
    return `<table style="width:100%;border-collapse:collapse;font-size:16px">
      <tr style="color:var(--soft);font-size:13px;text-align:left">
        <th style="padding:6px 4px">${t("rank")}</th><th>${t("no")}</th>
        ${showTry?`<th style="text-align:right">${t("times")}</th>`:""}
        ${cols.map(c=>`<th style="text-align:right">${c[0]}</th>`).join("")}</tr>
      ${rows.map((r,i)=>`<tr style="border-top:1px solid var(--line);${
        r.cls===S.cls&&r.no==S.grp?"background:#fff8ea;font-weight:700":""}">
        <td style="padding:8px 4px">${medal(i)}</td>
        <td>${r.no}</td>
        ${showTry?`<td style="text-align:right">${t("nth").replace("%n",r.attempt)}</td>`:""}
        ${cols.map(c=>`<td style="text-align:right">${c[1](r)}</td>`).join("")}</tr>`).join("")}
    </table>`;
  }

  if(boardTab===0){                                     // 總榜
    const list=byPlayer(r=>({total:r.total,max:r.max,sec:r.sec}),cmpAll)
      .filter(r=>r.cls===S.cls).sort(cmpAll);
    bc.appendChild(el(`<div class="card">
      <div class="big">${t("mine")}　${S.cls}</div>
      <p class="muted" style="margin-top:-4px">${t("byall")}</p>
      ${list.length?table(list,[[t("total"),r=>`${r.total}/${r.max}`],[t("time"),r=>fmt(r.sec)]])
                   :`<p class="muted">${t("norec")}</p>`}</div>`));
  } else if(boardTab===7){                              // 班際
    const best=byPlayer(r=>({total:r.total,max:r.max,sec:r.sec}),cmpAll);
    const cls={};
    best.forEach(r=>{ const c=cls[r.cls]=cls[r.cls]||{n:0,full:0,tot:0};
      c.n++; c.tot+=r.total; if(r.total===r.max) c.full++; });
    const inter=Object.entries(cls).map(([c,v])=>({c,n:v.n,
      rate:Math.round(v.full/v.n*100), avg:(v.tot/v.n).toFixed(1)}))
      .sort((a,b)=> b.rate-a.rate || b.avg-a.avg);
    bc.appendChild(el(`<div class="card">
      <div class="big">${t("inter")}</div>
      <p class="muted" style="margin-top:-4px">${L?"Ranked by the share of players who got full marks."
        :"按「全對人數佔全班的比例」排名，不是比分數高低。"}</p>
      <table style="width:100%;border-collapse:collapse;font-size:16px">
        <tr style="color:var(--soft);font-size:13px;text-align:left">
          <th style="padding:6px 4px">${t("rank")}</th><th>${L?"Class":"班別"}</th>
          <th style="text-align:right">${t("rate")}</th><th style="text-align:right">${t("players")}</th></tr>
        ${inter.map((r,i)=>`<tr style="border-top:1px solid var(--line);${
          r.c===S.cls?"background:#fff8ea;font-weight:700":""}">
          <td style="padding:8px 4px">${medal(i)}</td><td>${r.c}</td>
          <td style="text-align:right">${r.rate}%</td>
          <td style="text-align:right">${r.n}</td></tr>`).join("")}
      </table></div>`));
  } else {                                              // 單一關卡
    const k=boardTab-1;
    const list=byPlayer(r=>{ const st=r.stages&&r.stages[k];
        return st && st.n ? {ok:st.ok,n:st.n,hint:st.hint,sec:st.sec} : null; }, cmpStage)
      .filter(r=>r.cls===S.cls).sort(cmpStage);
    const varied=list.some(r=>r.ok!==r.n);              // 有無人唔係滿分
    // 第三關的數字是「按了幾次提示」，其餘各關是「做錯次數」
    const hintLabel = k===2 ? t("hints") : t("mistakes");
    const cols = varied
      ? [[t("result"),r=>`${r.ok}/${r.n}`],[t("time"),r=>fmt(r.sec)]]
      : [[t("time"),r=>fmt(r.sec)],[hintLabel,r=>r.hint]];
    bc.appendChild(el(`<div class="card">
      <div class="big">${tabs[boardTab]}　${S.cls}</div>
      <p class="muted" style="margin-top:-4px">${varied?t("byok"):t("bytime")}</p>
      ${list.length?table(list,cols):`<p class="muted">${t("norec")}</p>`}</div>`));
  }
  document.getElementById("bk").onclick=()=>finale();
}

/* ── 路由 ── */
function router(){
  if(!S.cls||!S.grp) return screenStart();
  const n=S.stage;
  if(n>=6) return finale();
  [stage1,stage2,stage3,stage4,stage5,stage6][n]();
}
router();
</script>
</body>
</html>
